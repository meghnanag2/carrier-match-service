<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto">
  <defs>
    <!-- Clean White Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Sleek Header Accent Bar -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Glossy Effect for text -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Box (Pure White with Subtle Road Line at Bottom) -->
  <rect width="1200" height="240" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#accentGrad)" />

  <!-- Road Stripe Graphic at the bottom of the banner to represent a road -->
  <path d="M 40,210 L 1160,210" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="16 12" />

  <!-- Professional Vector Truck Icon Container -->
  <g transform="translate(60, 55)">
    <rect width="110" height="110" rx="16" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" />
    <!-- Custom Vector Semi-Truck Graphic -->
    <g transform="translate(15, 20) scale(2.6)" fill="#0284c7">
       <path d="M19.5 8.5h-2.3l-1.7-3.5C15.3 4.5 14.7 4 14 4H6c-.7 0-1.3.5-1.5 1L3 8.5H1v2h2v7c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-7h2v-2zM6 6h8l1.3 2.5H4.7L6 6zM17 17.5c0 .3-.2.5-.5.5h-11c-.3 0-.5-.2-.5-.5v-7h12v7z"/>
       <circle cx="6.5" cy="16.5" r="1.5"/>
       <circle cx="14.5" cy="16.5" r="1.5"/>
    </g>
  </g>

  <!-- Typography Section -->
  <g transform="translate(205, 0)">
    
    <!-- MAIN TITLE (Title Case, No Dash, Styled Text) -->
    <!-- Layer 1: Text -->
    <text x="0" y="95" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="54" 
          font-weight="900" 
          letter-spacing="-1"
          fill="#0f172a">
      Carrier Match Service
    </text>
    <!-- Layer 2: Gloss Overlay -->
    <text x="0" y="95" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="54" 
          font-weight="900" 
          letter-spacing="-1"
          fill="url(#glossGrad)">
      Carrier Match Service
    </text>

    <!-- Subtitle -->
    <text x="0" y="138" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="18" 
          font-weight="500" 
          fill="#475569">
      High-performance Go freight matching backend with atomic dispatches and worker pools.
    </text>

    <!-- Tech Stack Badges -->
    <g transform="translate(0, 175)">
      <!-- GO -->
      <rect x="0" y="0" width="55" height="26" rx="6" fill="#00add8" />
      <text x="27.5" y="18" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">GO</text>

      <!-- SQLITE -->
      <rect x="63" y="0" width="80" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="103" y="18" fill="#334155" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">SQLITE</text>

      <!-- STRIPE API -->
      <rect x="151" y="0" width="105" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="203.5" y="18" fill="#334155" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">STRIPE TEST</text>

      <!-- WORKER POOL -->
      <rect x="264" y="0" width="115" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="321.5" y="18" fill="#334155" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">WORKER POOL</text>
    </g>
  </g>
</svg>
